<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mistCore" x1="42" y1="28" x2="45" y2="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFC"/>
      <stop offset=".55" stop-color="#DFECF2"/>
      <stop offset="1" stop-color="#B9D3E0"/>
    </linearGradient>
  </defs>
  <!-- Cove: mist-blue bay, shell-pink light, and a sheltered lighthouse. -->
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="15.25" fill="#EDF4F7" stroke="#DCE7EC" stroke-width="1.5"/>
  <!-- A quiet sweep of light balances the lighthouse on the right. -->
  <path d="M42 21 12 14v20l30-9Z" fill="#F7E8EC"/>
  <path d="m42 21-30-7v4l30 5Z" fill="#DEA0AF" fill-opacity=".45"/>
  <!-- Compact lantern and tapered tower; no fragile outline details. -->
  <path d="M40 26h8l2 20H38l2-20Z" fill="#3F789F"/>
  <path d="M42 28h4l1.5 15h-7L42 28Z" fill="url(#mistCore)"/>
  <path d="M42.7 29h1.1l1.1 13h-2.7l.5-13Z" fill="#FFF" fill-opacity=".28"/>
  <path d="M40 19h8v7h-8z" fill="#3F789F"/>
  <path d="M42 20h4v4h-4z" fill="#F8FBFC"/>
  <path d="m38 18 5-6a1.3 1.3 0 0 1 2 0l5 6H38Z" fill="#DEA0AF"/>
  <path d="M38.5 26h11" stroke="#3F789F" stroke-width="3" stroke-linecap="round"/>
  <!-- One continuous bay curve connects the tower and the water. -->
  <path d="M11 42c7-7 14-6 23 0 8 5.5 14 5 19-1-1 10-11 15-21 10-9-4.5-13-12-21-9Z" fill="#6799BD"/>
  <path d="M11 42c7-7 14-6 23 0 8 5.5 14 5 19-1" stroke="#3F789F" stroke-width="3.5" stroke-linecap="round"/>
</svg>
